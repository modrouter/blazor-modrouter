# The CI for ModRouter: the same commands run locally from the repository root.
name: ModRouter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build (warnings are errors)
        run: dotnet build ModRouter.Test/ModRouter.Test.csproj -c Release -f ${{ matrix.framework }}
      - name: Build the lab and the sample (net10.0 only)
        if: matrix.framework == 'net10.0'
        run: |
          dotnet build ModRouter.Lab/ModRouter.Lab.csproj -c Release
          dotnet build ModRouter.Sample/ModRouter.Sample.csproj -c Release
      - name: Test
        run: dotnet test ModRouter.Test/ModRouter.Test.csproj -c Release -f ${{ matrix.framework }} --no-build --logger "trx;LogFileName=test-${{ matrix.framework }}.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.framework }}
          path: "**/TestResults/*.trx"

  # The behavior bUnit cannot reproduce (Blazor's navigation hooks, focus, scroll restore, view transitions, trimming) is checked in a
  # real browser: the sample is published trimmed, served as a published app is, and driven by headless Chrome.
  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the sample (Release, trimmed)
        run: dotnet publish ModRouter.Sample/ModRouter.Sample.csproj -c Release -o pub
      - name: Serve it
        run: |
          node ModRouter.Sample/tools/serve.mjs pub/wwwroot 5177 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:5177/ > /dev/null && exit 0; sleep 1; done
          echo "the sample did not start" && exit 1
      - name: Run the browser checks
        run: node ModRouter.Sample/tools/verify-all.mjs http://localhost:5177/

  pack:
    name: Pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Pack
        run: |
          dotnet pack ModRouter/ModRouter.csproj -c Release -o artifacts
          dotnet pack ModRouter.AspNetCore/ModRouter.AspNetCore.csproj -c Release -o artifacts
      - name: Check the ModRouter package contents
        run: |
          package=$(ls artifacts/ModRouter.[0-9]*.nupkg)
          listing=$(unzip -Z1 "$package")
          for entry in lib/net8.0/ModRouter.dll lib/net9.0/ModRouter.dll lib/net10.0/ModRouter.dll analyzers/dotnet/cs/ModRouter.Generators.dll staticwebassets/mod-router.js README.md; do
            echo "$listing" | grep -qx "$entry" || { echo "missing $entry"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
